spring.application.name=workouttrackerapi
spring.profiles.active=dev

server.port=8081

spring.datasource.url=jdbc:h2:file:./data/fitnessdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.root=INFO
logging.level.com.marosirobi.workouttrackerapi=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{1} - %msg%n
